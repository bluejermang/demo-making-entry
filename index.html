<!doctype html>
<!--
  바뀌지 않는 입구 주소 (2026-10-27, g2b-product 입구와 같은 방식) — src/entry.js 가 GitHub Pages 저장소(.env DEMO_ENTRY_REPO)에 올린다.
  서버 PC 가 켜져 있으면 그 서버의 지금 외부 접속 주소(data/live.json, 서버를 켤 때마다 바뀜)로 옮겨 가고, 꺼져 있으면 안내만 한다.
    <입구>/#…                    → <서버>/#…                  (편집기 · 데모 목록 — 보던 화면 주소도 그대로)
    <입구>/?play=<데모 id>       → <서버>/play/<데모 id>      (게시한 데모 링크)
    <입구>/?play=<데모 id>&embed → <서버>/play/<데모 id>?embed (제품에 삽입한 iframe — 여백 없이 · 바탕 투명)
    <입구>/?guide=<데모 id>      → <서버>/guide/<데모 id>     (Step-by-Step 가이드 — 2026-10-29)
    ?play · ?guide 말고 붙은 것(?step=3 · ?draft=1)과 #… 는 그대로 넘긴다.
    <입구>/?team=<코드>          → 이 브라우저가 팀 접속 코드를 기억하고(주소에서는 지움) 편집기로 갈 때 <서버>/?code=<코드> 로 건넨다
                                  (2026-10-28 — 서버는 편집기 · 목록 · 편집 중 화면을 팀 코드를 넣은 브라우저에만 연다. 게시한 데모 링크에는 붙이지 않는다)
  여기에는 입구 한 장과 서버 주소만 있다 — 데모 문서 · 그림 · 영상은 올리지 않는다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>제품 데모 제작</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#f5f6f8; --surface:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --amber:#a15c07;
      font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color-scheme:light; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-size:15px; line-height:1.6; }
    main { width:min(520px, calc(100% - 32px)); padding:32px; background:var(--surface); border:1px solid var(--line); border-radius:14px; text-align:center; }
    h1 { margin:0 0 18px; font-size:19px; }
    .state { margin:0 0 6px; font-size:17px; font-weight:700; }
    .desc { margin:0 0 18px; color:var(--muted); }
    .off .state, .bad .state { color:var(--amber); }
    .spinner { width:22px; height:22px; margin:0 auto 12px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    .off .spinner, .bad .spinner { display:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
    button { padding:9px 18px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button[hidden] { display:none; }
    .checked { margin:12px 0 0; font-size:12.5px; color:var(--muted); }
    /* 제품에 삽입한 iframe 안 (?embed): 플레이어처럼 여백 없이 · 바탕 투명, 제목 없이 안내만 */
    .is-embed body { background:transparent; }
    .is-embed main { border:0; background:transparent; padding:16px; }
    .is-embed h1 { display:none; }
  </style>
  <script>try{var q=new URLSearchParams(location.search);if(q.has('play')&&q.has('embed')&&q.get('embed')!=='0')document.documentElement.classList.add('is-embed');}catch(e){}</script>
</head>
<body>
  <main id="box" aria-live="polite">
    <h1 id="title">제품 데모 제작</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p class="state" id="state">서버에 연결하는 중…</p>
    <p class="desc" id="desc">잠시만 기다려 주세요.</p>
    <button type="button" id="retry" hidden>다시 시도</button>
    <p class="checked" id="checked"></p>
  </main>
  <script>
    // 이 페이지는 입구만 한다: 서버 PC 가 켜져 있으면 그 PC 의 서버 주소로 옮겨 가고, 꺼져 있으면 안내만 한다.
    // 서버 주소(data/live.json)는 서버가 켜지면서 새 주소를 받을 때마다 자동으로 바뀐다.
    var RETRY_MS = 30000;
    var ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
    var box = document.getElementById('box');
    var stateEl = document.getElementById('state');
    var descEl = document.getElementById('desc');
    var retry = document.getElementById('retry');
    var checked = document.getElementById('checked');
    var timer = null;
    var TEAM_KEY = 'demoMakingTeamCode';
    var params = new URLSearchParams(location.search);
    var play = params.get('play'); // 게시한 데모 링크 · 삽입 코드 (없으면 null = 편집기 화면)
    var page = 'play';
    // Step-by-Step 가이드 링크 (?guide=<id>, 2026-10-29) — 데모 링크와 같은 길로 <서버>/guide/<id> 에
    if (play === null && params.get('guide') !== null) {
      play = params.get('guide');
      page = 'guide';
    }
    var isPlay = play !== null;

    // 팀원용 주소(?team=코드): 코드를 이 브라우저에 기억하고 주소창에서는 지운다. 저장하지 못하면 이번 한 번만 건넨다
    var teamGiven = (params.get('team') || '').trim().toUpperCase();
    if (teamGiven) {
      try { localStorage.setItem(TEAM_KEY, teamGiven); } catch (e) { /* 서버 화면에서 코드를 넣으면 된다 */ }
      try {
        var keep = location.search.replace(/^\?/, '').split('&').filter(function (part) { return part && part.split('=')[0] !== 'team'; }).join('&');
        history.replaceState(null, '', location.pathname + (keep ? '?' + keep : '') + location.hash);
      } catch (e) { /* 주소는 그대로 */ }
    }
    function teamCode() {
      try { return localStorage.getItem(TEAM_KEY) || teamGiven; } catch (e) { return teamGiven; }
    }

    if (isPlay) {
      document.title = page === 'guide' ? '단계별 가이드' : '제품 데모';
      document.getElementById('title').textContent = document.title;
    }

    function withTimeout(ms) {
      var controller = new AbortController();
      setTimeout(function () { controller.abort(); }, ms);
      return controller.signal;
    }

    function serverAlive(url) {
      return fetch(new URL('api/ping', url), { cache: 'no-store', signal: withTimeout(5000) })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) { return Boolean(data && data.ok); })
        .catch(function () { return false; });
    }

    /** ?play 말고 붙은 것(embed · step · draft)은 적힌 그대로 (?embed 처럼 = 없는 것도) */
    function restQuery() {
      return location.search.replace(/^\?/, '').split('&').filter(function (part) {
        if (!part) return false;
        var key = part.split('=')[0];
        try { key = decodeURIComponent(key.replace(/\+/g, ' ')); } catch (e) { /* 그대로 */ }
        return key !== 'play' && key !== 'guide' && key !== 'team';
      }).join('&');
    }

    /**
     * 옮겨 갈 주소: 편집기는 서버 주소 + 보던 화면(#…), 데모 링크는 서버 주소 + play/<id>.
     * 기억한 팀 접속 코드는 편집기와 편집 중 화면(?draft)에만 ?code= 로 건넨다 — 서버가 쿠키를 주고 code 를 뗀 주소로 보낸다
     */
    function targetFor(url) {
      var code = teamCode();
      if (!isPlay) {
        var to = new URL(location.hash || '', url);
        if (code) to.search = '?code=' + encodeURIComponent(code);
        return to.href;
      }
      var rest = restQuery();
      if (code && /(^|&)draft(=|&|$)/.test(rest)) rest += '&code=' + encodeURIComponent(code);
      return new URL(page + '/' + encodeURIComponent(play) + (rest ? '?' + rest : '') + location.hash, url).href;
    }

    function showOff(hasServer) {
      box.className = 'off';
      stateEl.textContent = '지금은 접속할 수 없습니다';
      if (isPlay) {
        descEl.textContent = '데모를 보여 주는 서버가 꺼져 있거나 켜지는 중입니다. 서버가 켜지면 자동으로 연결됩니다.';
      } else {
        descEl.textContent = hasServer
          ? '서버 PC가 꺼져 있거나 켜지는 중입니다. PC가 켜지면 1~3분 안에 자동으로 연결됩니다.'
          : '아직 서버 PC가 연결된 적이 없습니다. 서버 PC를 켜 주세요.';
      }
      retry.hidden = false;
      var now = new Date();
      checked.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0')
        + ' 확인 · 30초마다 다시 확인합니다';
    }

    function check() {
      clearTimeout(timer);
      fetch('data/live.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.json() : null; })
        .catch(function () { return null; })
        .then(function (live) {
          var url = live && live.serverUrl;
          if (!url) return showOff(false);
          return serverAlive(url).then(function (alive) {
            if (alive) {
              stateEl.textContent = isPlay ? '데모를 여는 중…' : '서버로 이동합니다…';
              location.replace(targetFor(url));
            } else {
              showOff(true);
            }
          });
        })
        .then(function () { if (box.className === 'off') timer = setTimeout(check, RETRY_MS); });
    }

    retry.addEventListener('click', function () {
      box.className = '';
      stateEl.textContent = '서버에 연결하는 중…';
      descEl.textContent = '잠시만 기다려 주세요.';
      retry.hidden = true;
      check();
    });

    if (isPlay && !ID_RE.test(play)) {
      // 잘못 옮겨 적은 링크 — 다시 해 봐도 같으므로 확인하지 않는다
      box.className = 'bad';
      stateEl.textContent = '데모 주소가 올바르지 않습니다';
      descEl.textContent = '받은 링크를 다시 확인해 주세요.';
    } else {
      check();
    }
  </script>
</body>
</html>
